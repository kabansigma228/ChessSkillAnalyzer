
name: Build Chess Skill Analyzer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessSkillAnalyzer_Android_Kotlin.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Add NDK compiler to PATH
        run: |
          echo "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Download Stockfish source
        run: |
          git clone --depth 1 https://github.com/official-stockfish/Stockfish.git stockfish-src

      - name: Build Stockfish for Android ARM64
        run: |
          make -C stockfish-src/src net
          make -C stockfish-src/src -j2 build ARCH=armv8 COMP=ndk
          test -x stockfish-src/src/stockfish

      - name: Extract Android project
        run: |
          unzip ChessSkillAnalyzer_Android_Kotlin.zip -d appsrc
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'kotlin.code.style=official' \
            > appsrc/gradle.properties

      - name: Package Stockfish binary
        run: |
          mkdir -p appsrc/app/src/main/jniLibs/arm64-v8a
          cp stockfish-src/src/stockfish \
            appsrc/app/src/main/jniLibs/arm64-v8a/libstockfish.so
          chmod 755 appsrc/app/src/main/jniLibs/arm64-v8a/libstockfish.so

      - name: Patch Stockfish launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path("appsrc/app/src/main").rglob("MainActivity.kt"))
          if len(files) != 1:
              raise RuntimeError(f"Expected one MainActivity.kt, found {len(files)}")

          p = files[0]
          s = p.read_text()

          pattern = r'class StockfishEngine\(private val context: android\.content\.Context\)\s*\{.*?\n\}\s*(?=object ChessPosition)'

          replacement = r'''class StockfishEngine(private val context: android.content.Context) {
              fun analyze(fen: String, depth: Int): EngineResult = try {
                  val abi = android.os.Build.SUPPORTED_ABIS.firstOrNull() ?: "unknown"
                  if (abi != "arm64-v8a") error("Неподдерживаемая архитектура: $abi")

                  val target = java.io.File(
                      context.applicationInfo.nativeLibraryDir,
                      "libstockfish.so"
                  )
                  if (!target.isFile) error("Файл Stockfish не найден: ${target.absolutePath}")

                  val process = ProcessBuilder(target.absolutePath)
                      .directory(context.filesDir)
                      .redirectErrorStream(true)
                      .start()

                  val writer = process.outputStream.bufferedWriter()
                  val reader = process.inputStream.bufferedReader()

                  fun send(command: String) {
                      writer.write(command)
                      writer.newLine()
                      writer.flush()
                  }

                  send("uci")
                  var line: String?
                  var ready = false

                  while (true) {
                      line = reader.readLine() ?: break
                      if (line == "uciok") {
                          ready = true
                          break
                      }
                  }
                  if (!ready) error("Stockfish не ответил на UCI")

                  send("isready")
                  while (true) {
                      line = reader.readLine() ?: error("Stockfish не ответил на isready")
                      if (line.trim() == "readyok") break
                  }

                  send("position fen $fen")
                  send("go depth $depth")

                  var best = "—"
                  var score = "—"
                  var variation = ""

                  while (true) {
                      line = reader.readLine() ?: break

                      if (line.startsWith("info ") && line.contains(" score ")) {
                          val tokens = line.split(" ")
                          val si = tokens.indexOf("score")

                          if (si >= 0 && si + 2 < tokens.size) {
                              score = when (tokens[si + 1]) {
                                  "cp" -> String.format(
                                      java.util.Locale.US,
                                      "%+.2f пешки",
                                      tokens[si + 2].toInt() / 100.0
                                  )
                                  "mate" -> "мат в ${tokens[si + 2]}"
                                  else -> score
                              }
                          }

                          val pi = tokens.indexOf("pv")
                          if (pi >= 0) {
                              variation = tokens.drop(pi + 1).take(12).joinToString(" ")
                          }
                      }

                      if (line.startsWith("bestmove ")) {
                          best = line.split(" ").getOrNull(1) ?: "—"
                          break
                      }
                  }

                  send("quit")
                  writer.close()
                  process.waitFor()

                  EngineResult(
                      best,
                      score,
                      variation,
                      "Анализ завершён на глубине $depth."
                  )
              } catch (e: Exception) {
                  EngineResult(
                      "—",
                      "—",
                      "",
                      "Stockfish не найден или не запустился: ${e.message}"
                  )
              }
          }
          '''

          updated, count = re.subn(pattern, lambda _: replacement + "\n\n", s, count=1, flags=re.S)
          if count != 1:
              raise RuntimeError("Could not find StockfishEngine block in MainActivity.kt")

          p.write_text(updated)
          print("Stockfish launcher updated")
          PY

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("appsrc/app/build.gradle.kts")
          s = p.read_text()

          m = re.search(r'\bandroid\s*\{', s)
          if not m:
              raise RuntimeError("android block not found")

          start = m.start()
          opening = s.find("{", start)
          depth = 0
          end = None

          for i in range(opening, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break

          if end is None:
              raise RuntimeError("android block is incomplete")

          block = s[start:end + 1]

          for name in ("compileOptions", "kotlinOptions"):
              while True:
                  m = re.search(r'\b' + name + r'\s*\{', block)
                  if not m:
                      break
                  brace = block.find("{", m.start())
                  d = 0
                  finish = None
                  for i in range(brace, len(block)):
                      if block[i] == "{":
                          d += 1
                      elif block[i] == "}":
                          d -= 1
                          if d == 0:
                              finish = i
                              break
                  if finish is None:
                      raise RuntimeError(name + " block is incomplete")
                  block = block[:m.start()] + block[finish + 1:]

          settings = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          block = block[:-1] + settings + "\n}"
          s = s[:start] + block + s[end + 1:]
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p appsrc assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessSkillAnalyzer-APK
          path: appsrc/app/build/outputs/apk/debug/*.apk
