name: Build Chess Skill Analyzer APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ChessSkillAnalyzer_Android_Kotlin.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install Android platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip ChessSkillAnalyzer_Android_Kotlin.zip -d appsrc
          printf '%s\n' \
            'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
            'android.useAndroidX=true' \
            'kotlin.code.style=official' \
            > appsrc/gradle.properties

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("appsrc/app/build.gradle.kts")
          s = p.read_text()

          m = re.search(r'\bandroid\s*\{', s)
          if not m:
              raise RuntimeError("android block not found")

          start = m.start()
          opening = s.find("{", start)
          depth = 0
          end = None

          for i in range(opening, len(s)):
              if s[i] == "{":
                  depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i
                      break

          if end is None:
              raise RuntimeError("android block is incomplete")

          block = s[start:end + 1]

          for name in ("compileOptions", "kotlinOptions"):
              while True:
                  m = re.search(r'\b' + name + r'\s*\{', block)
                  if not m:
                      break
                  brace = block.find("{", m.start())
                  d = 0
                  finish = None
                  for i in range(brace, len(block)):
                      if block[i] == "{":
                          d += 1
                      elif block[i] == "}":
                          d -= 1
                          if d == 0:
                              finish = i
                              break
                  if finish is None:
                      raise RuntimeError(name + " block is incomplete")
                  block = block[:m.start()] + block[finish + 1:]

          settings = """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          """

          block = block[:-1] + settings + "\n}"
          s = s[:start] + block + s[end + 1:]
          p.write_text(s)

          print("Java and Kotlin targets set to 17 inside android block")
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p appsrc assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessSkillAnalyzer-APK
          path: appsrc/app/build/outputs/apk/debug/*.apk
